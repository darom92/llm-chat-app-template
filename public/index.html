<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Asistente WorkinBrands</title>
		<style>
			:root {
				--grad-top: #7866ff;
				--grad-bottom: #5a9bff;
				--ink: #1f2937;
				--muted: #6b7280;
				--line: #e5e7eb;
				--chip-from: #e8f4ff;
				--chip-to: #fbeeff;
				--chip-border: #8b5cf6;
				--bubble: #f3f4f6;
				--user: #5a9bff;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 16px;
				background: #eef0f5;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				color: var(--ink);
			}

			.panel {
				width: min(420px, 100%);
				height: min(680px, calc(100vh - 32px));
				min-height: 520px;
				background: #ffffff;
				border-radius: 20px;
				box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
				display: flex;
				flex-direction: column;
				overflow: hidden;
			}

			/* Cabecera con degradado */
			.hero {
				background: linear-gradient(180deg, var(--grad-top), var(--grad-bottom));
				color: #ffffff;
				padding: 20px 22px 24px;
				border-radius: 0 0 24px 24px;
			}

			.hero-top {
				display: flex;
				justify-content: flex-end;
				height: 22px;
			}

			.minimize {
				width: 22px;
				height: 2px;
				background: #ffffff;
				border-radius: 2px;
				margin-top: 6px;
			}

			.hero h1 {
				font-size: 26px;
				font-weight: 700;
				margin-top: 22px;
			}

			.hero p {
				font-size: 15px;
				line-height: 1.5;
				color: rgba(255, 255, 255, 0.9);
				margin-top: 10px;
			}

			.ask-form {
				display: flex;
				align-items: center;
				margin-top: 18px;
				background: #ffffff;
				border-radius: 12px;
				padding: 6px 6px 6px 16px;
				border: 1px solid rgba(255, 255, 255, 0.6);
			}

			#user-input {
				flex: 1;
				border: none;
				outline: none;
				font: inherit;
				font-size: 16px;
				color: var(--ink);
				background: transparent;
				min-width: 0;
				padding: 8px 0;
				resize: none;
			}

			#user-input::placeholder {
				color: #7a7a86;
			}

			#send-button {
				width: 36px;
				height: 36px;
				flex-shrink: 0;
				border: none;
				border-radius: 50%;
				background: #9a9aa6;
				color: #ffffff;
				font-size: 18px;
				cursor: pointer;
				display: grid;
				place-items: center;
			}

			#send-button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}

			/* Zona de conversación */
			.body {
				flex: 1;
				display: flex;
				flex-direction: column;
				min-height: 0;
				padding: 20px 22px;
			}

			.messages {
				flex: 1;
				overflow-y: auto;
				display: flex;
				flex-direction: column;
				gap: 10px;
			}

			.message {
				max-width: 85%;
				padding: 12px 14px;
				border-radius: 14px;
				font-size: 15px;
				line-height: 1.5;
			}

			.message p {
				white-space: pre-line;
				overflow-wrap: anywhere;
			}

			.assistant-message {
				background: var(--bubble);
				align-self: flex-start;
			}

			.user-message {
				background: var(--user);
				color: #ffffff;
				align-self: flex-end;
			}

			.typing-indicator {
				display: none;
				font-size: 13px;
				color: var(--muted);
				padding: 8px 0 0;
			}

			.typing-indicator.visible {
				display: block;
			}

			/* Sugerencias */
			.suggestions {
				margin-top: 16px;
			}

			.suggestions[hidden] {
				display: none;
			}

			.suggestions h2 {
				font-size: 18px;
				font-weight: 500;
				color: var(--ink);
			}

			.suggestions p {
				font-size: 15px;
				color: var(--muted);
				margin-top: 4px;
			}

			.chips {
				display: flex;
				flex-direction: column;
				gap: 10px;
				margin-top: 16px;
			}

			.chip {
				font: inherit;
				font-size: 15px;
				text-align: left;
				padding: 14px 16px;
				border-radius: 14px;
				border: 1.5px solid var(--chip-border);
				background: linear-gradient(90deg, var(--chip-from), var(--chip-to));
				color: var(--ink);
				cursor: pointer;
			}

			.chip:hover {
				box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2);
			}

			.chip:disabled {
				opacity: 0.6;
				cursor: not-allowed;
			}

			.chip:disabled:hover {
				box-shadow: none;
			}

			@media (max-width: 480px) {
				body {
					padding: 0;
				}
				.panel {
					height: 100vh;
					min-height: 0;
					border-radius: 0;
					box-shadow: none;
				}

				/* Cabecera compacta */
				.hero {
					padding: 14px 16px 16px;
					border-radius: 0 0 20px 20px;
				}
				.hero-top {
					display: none;
				}
				.hero h1 {
					font-size: 19px;
					margin-top: 0;
				}
				.hero p {
					font-size: 13px;
					margin-top: 4px;
				}
				.ask-form {
					margin-top: 12px;
					padding: 4px 4px 4px 14px;
				}
				#user-input {
					font-size: 15px;
					padding: 6px 0;
				}

				/* Conversación ocupa el espacio restante */
				.body {
					padding: 12px 14px;
					min-height: 0;
				}
				.messages {
					flex: 1;
					min-height: 0;
				}
				.message {
					max-width: 92%;
					font-size: 14px;
				}

				/* Preguntas en una fila deslizable, sin ocupar mucho alto */
				.suggestions {
					margin-top: 10px;
					flex-shrink: 0;
				}
				.suggestions h2 {
					font-size: 15px;
				}
				.suggestions p {
					display: none;
				}
				.chips {
					flex-direction: row;
					flex-wrap: nowrap;
					overflow-x: auto;
					gap: 8px;
					margin-top: 8px;
					padding-bottom: 4px;
					-webkit-overflow-scrolling: touch;
				}
				.chip {
					flex-shrink: 0;
					white-space: nowrap;
					font-size: 13px;
					padding: 9px 12px;
					border-radius: 12px;
				}
			}
		</style>
	</head>
	<body>
		<div class="panel">
			<header class="hero">
				<div class="hero-top">
					<span class="minimize" aria-hidden="true"></span>
				</div>
				<h1>Asistente WorkinBrands</h1>
				<p>Pregunte sobre diseño web, precios y cómo trabajamos.</p>

				<form id="chat-form" class="ask-form">
					<textarea
						id="user-input"
						placeholder="Hacer una pregunta"
						rows="1"
					></textarea>
					<button id="send-button" type="submit" aria-label="Enviar">→</button>
				</form>
			</header>

			<main class="body">
				<div id="chat-messages" class="messages">
					<div class="message assistant-message">
						<p>¡Hola! Soy el asistente de WorkinBrands. ¿En qué puedo ayudarte?</p>
					</div>
				</div>

				<div class="typing-indicator" id="typing-indicator">Escribiendo…</div>

				<section id="suggestions" class="suggestions">
					<h2>¿Quiere ayuda para empezar?</h2>
					<p>Cuéntenos un poco lo que busca.</p>
					<div class="chips">
						<button class="chip" data-question="Quiero información sobre las webs y precios de WorkinBrands">Quiero información sobre las webs y precios</button>
						<button class="chip" data-question="¿Cuánto tarda en estar lista mi web?">¿Cuánto tarda en estar lista mi web?</button>
						<button class="chip" data-question="¿Qué incluye la página con asistente de IA?">¿Qué incluye la página con asistente de IA?</button>
						<button class="chip" data-question="Quiero pedir una demo gratuita">Quiero pedir una demo gratuita</button>
					</div>
				</section>
			</main>
		</div>

		<script src="chat.js"></script>
	</body>
</html>
